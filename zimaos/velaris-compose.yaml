name: velaris-zimaos
services:
  velaris-web:
    image: velaris-web:local
    container_name: velaris-zimaos-web
    restart: unless-stopped
    ports:
      - target: 80
        published: "8089"
        protocol: tcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
x-casaos:
  id: velaris
  main: velaris-web
  index: /
  port_map: "8089"
  scheme: http
  icon: https://raw.githubusercontent.com/Homiiboy/Velaris/main/assets/logos/NewAppIcon.png
  title:
    en_US: Velaris 2.0
    de_DE: Velaris 2.0
  tagline:
    en_US: Your Jellyfin streaming experience
    de_DE: Deine Jellyfin-Streaming-App
  description:
    en_US: Velaris 2.0.0 with category accent colors and Jellyfin playback.
    de_DE: Velaris 2.0.0 mit Kategorie-Akzentfarben und Jellyfin-Wiedergabe.
  author: Velaris
  developer: Velaris
  category: Entertainment
  architectures:
    - amd64
    - arm64
  version: "2.0.0"
  update_at: "2026-11-14"
  repo: https://github.com/Homiiboy/Velaris
  release_notes:
    en_US: Category accent colors for the Velaris 2.0.0 web app.
    de_DE: Kategorie-Akzentfarben für Velaris Web 2.0.0.

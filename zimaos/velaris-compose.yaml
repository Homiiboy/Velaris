name: velaris-zimaos
services:
  velaris-web:
    # Public, pullable Docker image: ZimaOS does not need a private/local image.
    image: nginx:1.27-alpine
    container_name: velaris-zimaos-web
    restart: unless-stopped
    ports:
      - "8089:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Replace __VELARIS_WEB_DIR__ with the *absolute* ZimaOS path to apps/web
      # before importing into the ZimaOS app installer.
      - "__VELARIS_WEB_DIR__:/usr/share/nginx/html:ro"
      - "__VELARIS_WEB_DIR__/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
x-casaos:
  id: velaris
  main: velaris-web
  index: /
  port_map: "8089"
  scheme: http
  icon: https://raw.githubusercontent.com/Homiiboy/Velaris/main/assets/logos/NewAppIcon.png
  title:
    en_US: Velaris 2.0
    de_DE: Velaris 2.0
  tagline:
    en_US: Your Jellyfin streaming experience
    de_DE: Deine Jellyfin-Streaming-App
  description:
    en_US: Velaris Web 2.1.0 with category color branding.
    de_DE: Velaris Web 2.1.0 mit Kategorie-Farbgestaltung.
  author: Velaris
  developer: Velaris
  category: Entertainment
  architectures:
    - amd64
    - arm64
  version: "2.1.0"
  update_at: "2026-11-14"
  repo: https://github.com/Homiiboy/Velaris

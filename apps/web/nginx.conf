server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 # Resolve optional YouTube OAuth only on request; the web UI must boot without it.
 # Keep the /api/youtube/ path-stripping behavior from the original proxy_pass.
 resolver 127.0.0.11 valid=10s ipv6=off;
 location /api/youtube/ {
  set $youtube_backend "velaris-google-oauth:8791";
  rewrite ^/api/youtube/(.*)$ /$1 break;
  proxy_pass http://$youtube_backend;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Velaris-Jellyfin-Token $http_x_velaris_jellyfin_token;
  proxy_set_header Authorization "";
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 90s;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
 }
 location /api/cast/ {
  proxy_pass http://host.docker.internal:8766/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Velaris-Jellyfin-Token $http_x_velaris_jellyfin_token;
  proxy_set_header Authorization "";
  proxy_connect_timeout 5s;
  proxy_read_timeout 35s;
  add_header Cache-Control "no-store" always;
 }
 location = /sw.js { add_header Cache-Control "no-cache"; }
 location / { try_files $uri $uri/ /index.html; }
}